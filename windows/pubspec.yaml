# Windows-specific pubspec override
# This file is used by Flutter when building for Windows.
# It excludes plugins that don't have Windows implementations
# (like google_sign_in, which is Android-only).
# The Android build uses the root pubspec.yaml, which includes all plugins.

name: lawyers_e_diary
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  # google_sign_in is excluded - Android-only plugin, not supported on Windows
  cloud_firestore: ^6.9.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  printing: ^5.15.0
  pdf: ^3.13.0
  path_provider: ^2.1.6
  intl: ^0.20.2
  drift: ^2.20.1
  sqlite3_flutter_libs: ^0.5.38
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/master logo.png
    - assets/images/Lawyer’s E-Diary rtu Profile Welcome Screen.png