name: LED gateway tests

on:
  push:
    branches:
      - "**"
    paths:
      - "gateway/**"
      - ".github/workflows/led-gateway-tests.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/led-gateway-tests.yml"

permissions:
  contents: read

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements.txt
      - name: Install gateway dependencies
        run: python -m pip install -r gateway/requirements.txt
      - name: Run gateway tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest gateway/tests -q
