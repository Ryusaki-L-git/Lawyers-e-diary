[project]
name = "led-ecourts-gateway"
version = "1.0.0"
description = "LED eCourts gateway — FastAPI Cloud deployment"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "firebase-admin>=6.0.0,<7.0",
    "google-cloud-firestore>=2.21.0,<3.0",
    "httpx>=0.27.0,<1.0",
]

[tool.fastapi]
entrypoint = "main:app"
